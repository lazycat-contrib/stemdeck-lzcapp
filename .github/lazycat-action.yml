version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/stemdeck.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: stemdeck

build:
  run_buildscript: false

images:
  - id: stemdeck
    target: service
    service: stemdeck
    source: ghcr.io/stemdeckapp/stemdeck
    channel: stable
    sort: semver
    tag_regex: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: StemDeck
    summary: "Stem extraction and interactive mixing for musicians"
